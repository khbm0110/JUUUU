    <style>
      /* ===== DESIGN SYSTEM: Cabinet Hassar - Liquid Glass Authority ===== */
      :root {
        /* Core palette */
        --gold: #C9A84C;
        --gold-light: #E2C97E;
        --gold-dark: #A07E2E;
        --gold-glow: rgba(201, 168, 76, 0.15);
        --navy-deep: #060A13;
        --navy: #0B1120;
        --navy-mid: #0F172A;
        --navy-light: #162033;
        --navy-card: #111827;
        --surface: #1E293B;
        
        /* Glassmorphism tokens */
        --glass-bg: rgba(15, 23, 42, 0.6);
        --glass-bg-heavy: rgba(15, 23, 42, 0.85);
        --glass-border: rgba(201, 168, 76, 0.08);
        --glass-border-hover: rgba(201, 168, 76, 0.25);
        --glass-blur: blur(20px);
        --glass-blur-heavy: blur(40px);
        
        /* Text */
        --text-primary: #F1F5F9;
        --text-secondary: #94A3B8;
        --text-muted: #64748B;
        
        /* Shadows */
        --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
        --shadow-md: 0 4px 16px rgba(0,0,0,0.4);
        --shadow-lg: 0 8px 32px rgba(0,0,0,0.5);
        --shadow-gold: 0 4px 24px rgba(201, 168, 76, 0.12);
        --shadow-gold-lg: 0 8px 40px rgba(201, 168, 76, 0.2);
        --shadow-inset-gold: inset 0 1px 0 rgba(201, 168, 76, 0.1);
        
        /* Spacing scale */
        --space-xs: 4px;
        --space-sm: 8px;
        --space-md: 16px;
        --space-lg: 24px;
        --space-xl: 32px;
        --space-2xl: 48px;
        --space-3xl: 64px;
        --space-4xl: 96px;
        
        /* Radius */
        --radius-sm: 8px;
        --radius-md: 12px;
        --radius-lg: 16px;
        --radius-xl: 24px;
        --radius-full: 9999px;
        
        /* Transitions */
        --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
        --ease-out-quart: cubic-bezier(0.25, 1, 0.5, 1);
        --transition-fast: 150ms var(--ease-out-expo);
        --transition-base: 300ms var(--ease-out-expo);
        --transition-slow: 500ms var(--ease-out-expo);
      }

      /* ===== LOADER ===== */
      #loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: var(--navy-deep);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.8s ease, visibility 0.8s ease;
      }
      .loader-inner {
        position: relative;
        width: 48px;
        height: 48px;
      }
      .loader-inner::before,
      .loader-inner::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid transparent;
      }
      .loader-inner::before {
        border-top-color: var(--gold);
        animation: spin 1s linear infinite;
      }
      .loader-inner::after {
        border-bottom-color: var(--gold-dark);
        animation: spin 1.5s linear infinite reverse;
        inset: 6px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      body.loaded #loader {
        opacity: 0;
        visibility: hidden;
      }

      /* ===== BASE ===== */
      html {
        scroll-behavior: smooth;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      body {
        font-family: 'Inter', 'Noto Sans Arabic', system-ui, sans-serif;
        background-color: var(--navy-deep);
        color: var(--text-primary);
        line-height: 1.6;
        overflow-x: hidden;
      }
      h1, h2, h3, h4, h5, h6, .font-heading {
        font-family: 'Playfair Display', 'Noto Naskh Arabic', Georgia, serif;
        line-height: 1.2;
        letter-spacing: -0.01em;
      }
      .font-body {
        font-family: 'Inter', 'Noto Sans Arabic', system-ui, sans-serif;
      }
      html[lang="ar"] body,
      html[lang="ar"] .font-body {
        font-family: 'Noto Sans Arabic', 'Inter', system-ui, sans-serif;
      }
      html[lang="ar"] h1, html[lang="ar"] h2, html[lang="ar"] h3,
      html[lang="ar"] h4, html[lang="ar"] h5, html[lang="ar"] h6,
      html[lang="ar"] .font-heading {
        font-family: 'Noto Naskh Arabic', 'Playfair Display', Georgia, serif;
      }
      main > div[id] {
        scroll-margin-top: 80px;
      }

      /* ===== SCROLL PROGRESS BAR ===== */
      .scroll-progress {
        position: fixed;
        top: 0;
        left: 0;
        height: 2px;
        background: linear-gradient(90deg, var(--gold-dark), var(--gold), var(--gold-light));
        z-index: 9998;
        transform-origin: left;
        transform: scaleX(0);
        transition: transform 100ms linear;
      }

      /* ===== GLASSMORPHISM UTILITIES ===== */
      .glass {
        background: var(--glass-bg);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1px solid var(--glass-border);
      }
      .glass-heavy {
        background: var(--glass-bg-heavy);
        backdrop-filter: var(--glass-blur-heavy);
        -webkit-backdrop-filter: var(--glass-blur-heavy);
        border: 1px solid var(--glass-border);
      }
      .glass-gold {
        background: rgba(201, 168, 76, 0.06);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1px solid rgba(201, 168, 76, 0.12);
      }
      .glass-card {
        background: linear-gradient(135deg, rgba(15, 23, 42, 0.7) 0%, rgba(30, 41, 59, 0.4) 100%);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1px solid var(--glass-border);
        box-shadow: var(--shadow-inset-gold);
      }
      .glass-card:hover {
        border-color: var(--glass-border-hover);
        box-shadow: var(--shadow-inset-gold), var(--shadow-gold);
        transform: translateY(-4px);
      }

      /* ===== GRADIENT UTILITIES ===== */
      .text-gold-gradient {
        background: linear-gradient(135deg, var(--gold-dark), var(--gold), var(--gold-light));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .bg-gradient-gold {
        background: linear-gradient(135deg, var(--gold-dark), var(--gold), var(--gold-light));
      }
      .bg-gradient-navy {
        background: linear-gradient(180deg, var(--navy-deep) 0%, var(--navy-mid) 100%);
      }
      .bg-mesh {
        background: 
          radial-gradient(at 20% 20%, rgba(201, 168, 76, 0.04) 0%, transparent 50%),
          radial-gradient(at 80% 80%, rgba(30, 58, 138, 0.06) 0%, transparent 50%),
          radial-gradient(at 50% 50%, rgba(201, 168, 76, 0.02) 0%, transparent 70%);
      }
      .bg-noise::before {
        content: '';
        position: absolute;
        inset: 0;
        opacity: 0.03;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        background-repeat: repeat;
        pointer-events: none;
        z-index: 0;
      }

      /* ===== SECTION DIVIDER ===== */
      .section-divider {
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--glass-border-hover), transparent);
      }
      .section-divider-gold {
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(201,168,76,0.3), transparent);
      }

      /* ===== BADGE / LABEL ===== */
      .section-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 16px;
        border-radius: var(--radius-full);
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--gold);
        background: rgba(201, 168, 76, 0.08);
        border: 1px solid rgba(201, 168, 76, 0.15);
      }
      .section-badge::before {
        content: '';
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--gold);
        box-shadow: 0 0 8px rgba(201, 168, 76, 0.5);
      }

      /* ===== BUTTONS ===== */
      .btn-primary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 14px 32px;
        border-radius: var(--radius-full);
        font-weight: 600;
        font-size: 1rem;
        color: var(--navy-deep);
        background: linear-gradient(135deg, var(--gold), var(--gold-light));
        border: none;
        cursor: pointer;
        transition: all var(--transition-base);
        box-shadow: var(--shadow-gold);
        position: relative;
        overflow: hidden;
      }
      .btn-primary::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, var(--gold-light), var(--gold));
        opacity: 0;
        transition: opacity var(--transition-base);
      }
      .btn-primary:hover::before {
        opacity: 1;
      }
      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-gold-lg);
      }
      .btn-primary span,
      .btn-primary svg {
        position: relative;
        z-index: 1;
      }
      
      .btn-outline {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 14px 32px;
        border-radius: var(--radius-full);
        font-weight: 600;
        font-size: 1rem;
        color: var(--gold);
        background: transparent;
        border: 1.5px solid rgba(201, 168, 76, 0.4);
        cursor: pointer;
        transition: all var(--transition-base);
      }
      .btn-outline:hover {
        background: rgba(201, 168, 76, 0.08);
        border-color: var(--gold);
        transform: translateY(-2px);
        box-shadow: var(--shadow-gold);
      }

      /* ===== ANIMATIONS ===== */
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .cursor-blink {
        animation: blink 1s step-end infinite;
      }

      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-12px); }
      }
      .animate-float {
        animation: float 6s ease-in-out infinite;
      }

      @keyframes pulse-gold {
        0%, 100% { box-shadow: 0 0 0 0 rgba(201, 168, 76, 0.4); }
        50% { box-shadow: 0 0 0 12px rgba(201, 168, 76, 0); }
      }
      .pulse-gold {
        animation: pulse-gold 2.5s ease-in-out infinite;
      }

      @keyframes shimmer {
        0% { background-position: -200% center; }
        100% { background-position: 200% center; }
      }
      .shimmer {
        background: linear-gradient(90deg, transparent, rgba(201,168,76,0.1), transparent);
        background-size: 200% 100%;
        animation: shimmer 3s ease-in-out infinite;
      }

      @keyframes fade-up {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-up {
        animation: fade-up 0.8s var(--ease-out-expo) forwards;
      }

      @keyframes scale-in {
        from { opacity: 0; transform: scale(0.9); }
        to { opacity: 1; transform: scale(1); }
      }
      .animate-scale-in {
        animation: scale-in 0.6s var(--ease-out-expo) forwards;
      }

      @keyframes slide-in-left {
        from { opacity: 0; transform: translateX(-40px); }
        to { opacity: 1; transform: translateX(0); }
      }
      @keyframes slide-in-right {
        from { opacity: 0; transform: translateX(40px); }
        to { opacity: 1; transform: translateX(0); }
      }

      @keyframes reveal-up {
        from { opacity: 0; transform: translateY(40px) scale(0.97); filter: blur(6px); }
        to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
      }
      .animate-reveal {
        animation: reveal-up 0.9s var(--ease-out-expo) forwards;
        opacity: 0;
      }

      @keyframes counter-glow {
        0%, 100% { text-shadow: 0 0 8px rgba(201,168,76,0.3); }
        50% { text-shadow: 0 0 20px rgba(201,168,76,0.5), 0 0 40px rgba(201,168,76,0.2); }
      }
      .animate-counter-glow {
        animation: counter-glow 3s ease-in-out infinite;
      }

      @keyframes gradient-shift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      .animate-gradient {
        background-size: 200% 200%;
        animation: gradient-shift 4s ease infinite;
      }

      @keyframes rotate-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .animate-rotate-slow {
        animation: rotate-slow 20s linear infinite;
      }

      @keyframes border-rotate {
        0% { --angle: 0deg; }
        100% { --angle: 360deg; }
      }

      /* Parallax helper */
      .parallax-slow { will-change: transform; }

      /* Magnetic hover effect for buttons */
      .magnetic-hover {
        transition: transform 300ms var(--ease-out-expo);
      }

      /* Text reveal line animation */
      @keyframes line-expand {
        from { width: 0; }
        to { width: 100%; }
      }
      .animate-line {
        animation: line-expand 0.8s var(--ease-out-expo) forwards;
      }

      /* Stagger children animation */
 .stagger-children > * {
        opacity: 0;
        transform: translateY(20px);
        transition: all 0.6s var(--ease-out-expo);
      }
      .stagger-children.in-view > *:nth-child(1) { transition-delay: 0ms; opacity: 1; transform: translateY(0); }
      .stagger-children.in-view > *:nth-child(2) { transition-delay: 80ms; opacity: 1; transform: translateY(0); }
      .stagger-children.in-view > *:nth-child(3) { transition-delay: 160ms; opacity: 1; transform: translateY(0); }
      .stagger-children.in-view > *:nth-child(4) { transition-delay: 240ms; opacity: 1; transform: translateY(0); }
      .stagger-children.in-view > *:nth-child(5) { transition-delay: 320ms; opacity: 1; transform: translateY(0); }
      .stagger-children.in-view > *:nth-child(6) { transition-delay: 400ms; opacity: 1; transform: translateY(0); }

      @keyframes hero-bg-zoom {
        0% { transform: scale(1.15); }
        100% { transform: scale(1); }
      }
      @media (max-width: 768px) {
        .hero-bg-zoom {
          animation: hero-bg-zoom 40s ease-in-out infinite alternate;
        }
      }

      /* Stagger delay utilities */
 .stagger-1 { animation-delay: 100ms; }
      .stagger-2 { animation-delay: 200ms; }
      .stagger-3 { animation-delay: 300ms; }
      .stagger-4 { animation-delay: 400ms; }
      .stagger-5 { animation-delay: 500ms; }
      .stagger-6 { animation-delay: 600ms; }

      /* ===== TILT CARD EFFECT ===== */
      .tilt-card {
        transition: transform 400ms var(--ease-out-expo), box-shadow 400ms ease;
        transform-style: preserve-3d;
        perspective: 800px;
      }
      .tilt-card:hover {
        box-shadow: var(--shadow-gold-lg), 0 0 60px rgba(201,168,76,0.08);
      }

      /* ===== HOVER UNDERLINE ===== */
      .hover-underline {
        position: relative;
        display: inline-block;
      }
      .hover-underline::after {
        content: '';
        position: absolute;
        bottom: -2px;
        left: 0;
        width: 0;
        height: 1.5px;
        background: var(--gold);
        transition: width 300ms var(--ease-out-expo);
      }
      .hover-underline:hover::after {
        width: 100%;
      }

      /* ===== BENTO GRID ===== */
      .bento-grid {
        display: grid;
        gap: 20px;
        grid-template-columns: repeat(3, 1fr);
        grid-auto-rows: minmax(180px, auto);
      }
      .bento-grid .bento-wide {
        grid-column: span 2;
      }
      .bento-grid .bento-tall {
        grid-row: span 2;
      }
      @media (max-width: 1024px) {
        .bento-grid {
          grid-template-columns: repeat(2, 1fr);
          grid-auto-rows: minmax(160px, auto);
        }
        .bento-grid .bento-wide {
          grid-column: span 2;
        }
        .bento-grid .bento-tall {
          grid-row: span 1;
        }
      }
      @media (max-width: 640px) {
        .bento-grid {
          grid-template-columns: 1fr;
          grid-auto-rows: auto;
        }
        .bento-grid .bento-wide,
        .bento-grid .bento-tall {
          grid-column: span 1;
          grid-row: span 1;
        }
      }

      /* ===== INPUT STYLES ===== */
      .input-glass {
        width: 100%;
        padding: 14px 18px;
        border-radius: var(--radius-md);
        background: rgba(15, 23, 42, 0.5);
        border: 1px solid rgba(201, 168, 76, 0.1);
        color: var(--text-primary);
        font-family: inherit;
        font-size: 0.95rem;
        transition: all var(--transition-base);
        outline: none;
      }
      .input-glass::placeholder {
        color: var(--text-muted);
      }
      .input-glass:focus {
        border-color: var(--gold);
        box-shadow: 0 0 0 3px rgba(201, 168, 76, 0.12), var(--shadow-inset-gold);
        background: rgba(15, 23, 42, 0.7);
      }

      /* ===== FLOATING WHATSAPP ===== */
      .whatsapp-float {
        position: fixed;
        bottom: 28px;
        right: 28px;
        z-index: 45;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: #25D366;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 20px rgba(37, 211, 102, 0.4);
        cursor: pointer;
        transition: all var(--transition-base);
      }
      .whatsapp-float:hover {
        transform: scale(1.1) translateY(-2px);
        box-shadow: 0 6px 28px rgba(37, 211, 102, 0.5);
      }
      html[lang="ar"] .whatsapp-float {
        right: auto;
        left: 28px;
      }

      /* ===== SCROLL TO TOP ===== */
      .scroll-top {
        position: fixed;
        bottom: 28px;
        right: 96px;
        z-index: 45;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all var(--transition-base);
        opacity: 0;
        visibility: hidden;
        transform: translateY(10px);
      }
      .scroll-top.visible {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }
      .scroll-top:hover {
        transform: translateY(-2px);
      }
      html[lang="ar"] .scroll-top {
        right: auto;
        left: 96px;
      }

      /* ===== SELECTION ===== */
      ::selection {
        background-color: rgba(201, 168, 76, 0.3);
        color: #F8FAFC;
      }

      /* ===== REDUCED MOTION ===== */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
        html { scroll-behavior: auto; }

  <body class="text-gray-300">
    <div id="loader"><div class="loader-inner"></div></div>
    <div class="scroll-progress" id="scrollProgress"></div>
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
    <script>
      window.addEventListener('load', () => {
        setTimeout(() => {
          document.body.classList.add('loaded');
        }, 100);
      });
      // Scroll progress bar
      window.addEventListener('scroll', () => {
        const scrollTop = window.scrollY;
        const docHeight = document.documentElement.scrollHeight - window.innerHeight;
        const progress = docHeight > 0 ? scrollTop / docHeight : 0;
        const bar = document.getElementById('scrollProgress');
        if (bar) bar.style.transform = `scaleX(${progress})`;
      }, { passive: true });
    </script>
  </body>
